[package]
name = "mcp-scanner"
version = "0.1.0"
edition = "2021"
description = "Repository Scanner MCP server (Rust) — git cloning, code analysis, LLM summarization"
license = "Apache-2.0"
repository = "https://github.com/Doki-Stack/mcp-scanner"

[dependencies]
doki-shared = { git = "https://github.com/Doki-Stack/shared-rust", branch = "main" }

# Web framework
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tokio-test = "0.4"
